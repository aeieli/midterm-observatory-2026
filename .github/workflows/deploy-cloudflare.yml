name: Cloudflare data and deployment

on:
  push:
    branches: [main]
    paths:
      - 'dist/data/*.json'
      - 'dist/locales/*.json'
      - 'dist/static-manifest.json'
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit operation; bootstrap reuses or creates the project database, migrate changes its schema, publish deploys then activates data
        required: true
        default: validate
        type: choice
        options:
          - validate
          - bootstrap
          - migrate
          - publish
          - sync-data

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  cloudflare:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: PROD
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Reject automatic pushes containing non-research changes before production secrets
        if: github.event_name == 'push'
        run: python3 scripts/check_auto_publish.py

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Test data integrity, history preservation, API, and static fallback
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/*.test.mjs
          python3 scripts/check-locales.py
          python3 scripts/build_static_manifest.py
          for source in dist/*.js dist/vendor/*.js src/*.js; do node --check "$source"; done
          python3 scripts/cloudflare_config.py

      - name: Check Worker and bindings without production credentials
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          CLOUDFLARE_API_TOKEN: ""
          CLOUDFLARE_ACCOUNT_ID: ""
        with:
          wranglerVersion: "4.151.3"
          packageManager: npm
          command: deploy --dry-run --config .wrangler/generated.json --outdir .wrangler/dry-run

      - name: Run the authorized production operation
        if: github.event_name == 'push' || inputs.operation != 'validate'
        env:
          CF_OPERATION: ${{ github.event_name == 'push' && 'publish' || inputs.operation }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: python3 scripts/cloudflare-ci.py "$CF_OPERATION" --remote
